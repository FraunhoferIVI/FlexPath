# Randomly sampled start points out of the 1/3 nodes with the highest cost to reach.
# 640k samples (includes augmentations)
# Introduces new obstacle class with different desired avoidance behavior, encoding: [100, 100, 255]
# Each sample has 10 added obstacles in the 10-cost neighborhood of the A* path, 5 of them -> normal obstacles, 5 of them -> new obstacle class
dataset:
  source: "localzarr"
  data_dir: "data/TMP_64k_obstacle_levels_rgb_v2"  # path to dir with train.npz / test.npz / validation.npz
  image_height: 64
  image_width: 64
  shift_p: 0.0  # Dataset is already augmented (this shift augmentation will add complexity)
  diagonal_movements_at_obstacle: true
  start_goal_included_in_label: true

# Normalization parameters
normalization:
  use_simple_norm: true  # If true, uses (0,0,0) mean and (1,1,1) std
